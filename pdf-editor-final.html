<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF編集 | ファイル工房</title><link rel="stylesheet" href="style.css"><style>.ed{max-width:1200px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px}.head h1{margin:0}.head p{color:#667085}.layout{display:grid;grid-template-columns:170px 1fr;gap:16px}.bar{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:9px;display:grid;gap:6px;height:max-content;position:sticky;top:70px}.bar button{border:1px solid transparent;background:#fff;border-radius:9px;padding:9px;text-align:left;font-weight:700;cursor:pointer}.bar button.on{background:#edf2ff;border-color:#b9c5ff;color:#294fd2}.work{background:#e9edf2;border-radius:16px;padding:30px 15px;min-height:70vh;overflow:auto}.pages{display:grid;gap:28px;justify-content:center}.pg{position:relative;background:#fff;box-shadow:0 6px 20px #0002}.pg canvas{display:block}.ov{position:absolute;inset:0;touch-action:none}.mk{position:absolute;border:2px solid;min-width:5px;min-height:4px}.highlight{background:#ffe66d88!important;border:0}.redact{background:#111!important;border:0}.underline{height:2px!important;border-width:0 0 3px}.it{position:absolute;z-index:3}.txt{font-size:18px;border:1px dashed #315efb;padding:4px}.stamp{border:3px solid #315efb;border-radius:8px;color:#315efb;padding:5px 10px;font-weight:800;background:#fff}.sig{width:180px;height:55px;border:1px dashed #315efb}.ink{position:absolute;inset:0}@media(max-width:760px){.ed{padding:14px 8px}.head{display:block}.layout{grid-template-columns:1fr}.bar{position:sticky;top:0;z-index:5;grid-template-columns:repeat(5,1fr)}.bar button{font-size:11px;text-align:center;padding:7px}.work{padding:28px 4px}}</style></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><span class="brand-mark">▦</span><span><strong>ファイル工房</strong><small>PDFをかんたん編集</small></span></a><div class="privacy-pill">🔒 ブラウザ内で処理</div></div></header><main class="ed"><div class="head"><div><p class="eyebrow">PDF編集</p><h1>PDFに書きこむ</h1><p>ツールを選んで、ページの上をタップ・ドラッグしてください。</p></div><label class="primary-button">PDFを開く<input id="f" type="file" accept="application/pdf" hidden></label></div><div class="layout"><nav class="bar"><button class="on" data-t="select">↖<span>選択</span></button><button data-t="text">T<span>文字</span></button><button data-t="highlight">▰<span>ハイライト</span></button><button data-t="underline">＿<span>下線</span></button><button data-t="redact">■<span>墨消し</span></button><button data-t="draw">✎<span>手書き</span></button><button data-t="rect">□<span>四角</span></button><button data-t="circle">○<span>丸</span></button><button data-t="stamp">★<span>スタンプ</span></button><button data-t="signature">署<span>署名</span></button><button id="save" class="primary-button" disabled>保存</button></nav><section class="work"><div id="pages" class="pages"></div></section></div></main><script type="module" src="js/pdf-editor.js"></script></body></html>
