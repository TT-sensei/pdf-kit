<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa"><title>Word → PDF | ファイル工房</title>
<link rel="stylesheet" href="style.css">
<style>
.word-wrap{max-width:980px;margin:0 auto;padding:24px 16px 56px}.word-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.word-head img{width:64px;height:64px;object-fit:contain}.word-head h1{margin:0;font-size:clamp(24px,4vw,34px)}.word-head p{margin:4px 0 0;color:#667085}.word-card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(16,24,40,.06)}.word-drop{border:2px dashed #cbd5e1;border-radius:18px;padding:42px 18px;text-align:center;background:#fafbfc;cursor:pointer}.word-drop.drag{background:#f1f5f9;border-color:#64748b}.word-drop .big{font-size:38px;line-height:1;margin-bottom:10px}.word-drop strong{display:block;font-size:18px}.word-drop span{display:block;color:#667085;margin:6px 0 16px}.word-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}.word-actions button{border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer}.word-primary{background:#111827;color:#fff}.word-secondary{background:#eef2f7;color:#344054}.word-status{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f8fafc;color:#475467}.word-status.error{background:#fff1f2;color:#b42318}.preview-wrap{margin-top:20px}.preview-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.preview-title h2{font-size:18px;margin:0}.doc-preview{background:#eef1f5;padding:24px;overflow:auto;border-radius:16px}.doc-page{width:794px;min-height:1123px;margin:0 auto 20px;background:#fff;padding:72px 68px;box-sizing:border-box;box-shadow:0 3px 12px rgba(0,0,0,.12);font-family:Arial,'Noto Sans JP',sans-serif;color:#222;line-height:1.65;font-size:14px}.doc-page h1{font-size:28px}.doc-page h2{font-size:22px}.doc-page h3{font-size:18px}.doc-page img{max-width:100%;height:auto}.doc-page table{border-collapse:collapse;width:100%}.doc-page td,.doc-page th{border:1px solid #bbb;padding:6px}.doc-page ul,.doc-page ol{padding-left:28px}.note{font-size:13px;color:#667085;margin-top:12px}.hidden{display:none!important}@media(max-width:700px){.doc-preview{padding:8px}.doc-page{transform-origin:top left;width:794px;margin-bottom:0}.word-card{padding:14px}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="index.html" style="text-decoration:none;color:inherit"><span class="brand-mark" aria-hidden="true">▦</span><span><strong>ファイル工房</strong><small>PDF・画像を、もっとかんたんに。</small></span></a><div class="privacy-pill">🔒 ブラウザ内で処理</div></div></header>
<main class="word-wrap">
<div class="word-head"><img src="https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/characters/kai/expressions/01-normal-smile.webp" alt="カイ"><div><h1>Word → PDF</h1><p>Wordファイルを、PDFに変換します。</p></div></div>
<section class="word-card">
<div id="drop" class="word-drop" tabindex="0"><div class="big">📄</div><strong>Wordファイルをここに入れる</strong><span>.docx を選択、またはドラッグ＆ドロップ</span><button id="pick" class="word-primary" type="button">Wordファイルを選択</button><input id="file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden></div>
<div id="status" class="word-status">まだファイルが選択されていません。</div>
<div class="word-actions"><button id="convert" class="word-primary" type="button" disabled>PDFを作成する</button><button id="clear" class="word-secondary" type="button" disabled>やり直す</button></div>
<p class="note">ファイルは外部サーバーへアップロードせず、このブラウザ内で変換します。複雑なWordレイアウトや特殊フォントは完全には再現できない場合があります。</p>
</section>
<section id="previewWrap" class="preview-wrap hidden"><div class="preview-title"><h2>変換前プレビュー</h2><span class="note">内容を確認してからPDFを作成できます</span></div><div id="preview" class="doc-preview"></div></section>
</main>
<footer class="site-footer">ファイル工房 · ブラウザ内処理で、学校のファイル仕事をシンプルに</footer>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s),drop=$('#drop'),file=$('#file'),status=$('#status'),preview=$('#preview'),wrap=$('#previewWrap'),convert=$('#convert'),clear=$('#clear');let current=null;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function setStatus(t,error=false){status.textContent=t;status.className='word-status'+(error?' error':'')}
async function load(f){if(!f||!/\.docx$/i.test(f.name)){setStatus('Word（.docx）ファイルを選択してください。',true);return}current=f;setStatus('Wordを読み込んでいます…');convert.disabled=true;clear.disabled=false;wrap.classList.add('hidden');preview.innerHTML='';try{const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()},{convertImage:mammoth.images.inline(async image=>({src:'data:'+image.contentType+';base64,'+await image.read('base64')}))});preview.innerHTML='<div class="doc-page">'+r.value+'</div>';wrap.classList.remove('hidden');setStatus('「'+f.name+'」を読み込みました。内容を確認してPDFを作成できます。');convert.disabled=false;if(r.messages?.length)status.textContent+=' 一部のWord機能は簡略化されています。'}catch(e){console.error(e);setStatus('Wordの読み込みに失敗しました。対応しているのは .docx 形式です。',true)}}
pick.onclick=()=>file.click();drop.onclick=e=>{if(e.target.closest('button'))return;file.click()};file.onchange=()=>load(file.files[0]);['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>load(e.dataTransfer.files[0]));
clear.onclick=()=>{current=null;file.value='';preview.innerHTML='';wrap.classList.add('hidden');convert.disabled=true;clear.disabled=true;setStatus('まだファイルが選択されていません。')};
convert.onclick=async()=>{if(!current)return;convert.disabled=true;setStatus('PDFを作成しています…');try{const {jsPDF}=window.jspdf;const pages=Array.from(preview.querySelectorAll('.doc-page'));const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});for(let i=0;i<pages.length;i++){if(i)pdf.addPage();const canvas=await html2canvas(pages[i],{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});const img=canvas.toDataURL('image/jpeg',.92);pdf.addImage(img,'JPEG',0,0,210,297,undefined,'FAST')}const name=current.name.replace(/\.docx$/i,'')+'.pdf';pdf.save(name);setStatus('PDFを作成しました。ダウンロードを開始しています。');}catch(e){console.error(e);setStatus('PDFの作成に失敗しました。ファイルが大きすぎる場合はページ数を減らして試してください。',true)}finally{convert.disabled=false}};
</script>
</body></html>
