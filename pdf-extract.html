<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fa"><title>PDFから抽出 | ファイル工房</title><link rel="stylesheet" href="style.css"><style>.extract-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.extract-options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.extract-option{border:1px solid var(--line);border-radius:12px;padding:14px}.extract-option label{font-weight:700;font-size:13px;display:block;margin-bottom:7px}.extract-option input,.extract-option select{width:100%;height:42px;border:1px solid #cfd5dd;border-radius:9px;padding:0 10px;background:#fff}.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.preview-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.preview-card img{display:block;width:100%;height:190px;object-fit:contain;background:#f2f4f7}.preview-card div{padding:9px;font-size:12px}.text-output{width:100%;min-height:300px;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.7 ui-monospace,monospace;resize:vertical}.muted{color:var(--muted);font-size:12px}@media(max-width:700px){.extract-options{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><span class="brand-mark">▦</span><span><strong>ファイル工房</strong><small>PDF・画像を、もっとかんたんに。</small></span></a><div class="privacy-pill">🔒 ブラウザ内で処理</div></div></header><main class="app-shell"><div class="tool-header"><a class="back-button" href="index.html">← トップへ</a><div><p class="eyebrow">PDFから取り出す</p><h2>PDF → 画像・テキスト</h2></div></div><div class="stepper"><span class="step active">① PDFを入れる</span><span class="step">② 取り出す</span><span class="step">③ 保存する</span></div><div id="drop" class="drop-zone" tabindex="0"><div class="drop-icon">＋</div><strong>PDFをここにドロップ</strong><span>または</span><button id="pick" class="primary-button" type="button">PDFを選択</button><small>ファイルは外部サーバーへ送信されません</small><input id="file" type="file" accept="application/pdf" hidden></div><div id="file-panel" class="panel" hidden></div><div id="settings" class="panel" hidden><h3>抽出するものを選択</h3><div class="extract-options"><div class="extract-option"><label for="mode">抽出方法</label><select id="mode"><option value="both">画像とテキスト</option><option value="image">画像だけ</option><option value="text">テキストだけ</option></select></div><div class="extract-option"><label for="scale">画像の解像度</label><select id="scale"><option value="1">標準</option><option value="1.5">高解像度</option><option value="2">最高解像度</option></select></div><div class="extract-option"><label for="range">ページ範囲</label><input id="range" placeholder="全ページ（例：1-5,8）"></div></div><div class="extract-actions"><button id="run" class="primary-button" type="button">抽出する</button></div></div><div id="progress" class="panel" hidden></div><div id="result" class="panel" hidden></div><div id="error" class="error-panel" hidden></div></main><footer class="site-footer">ファイル工房 · PDFをブラウザ内でかんたんに取り出す</footer><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script type="module" src="js/pdf-extract.js"></script></body></html>
