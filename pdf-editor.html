<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PDF編集 | ファイル工房</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><span class="brand-mark">▦</span><span><strong>ファイル工房</strong><small>PDFをかんたん編集</small></span></a><div class="privacy-pill">🔒 ブラウザ内で処理</div></div></header><main class="editor-shell"><div class="editor-head"><div><p class="eyebrow">PDF編集</p><h1>PDFに書きこむ</h1><p>文字や線を「置く・書く・隠す」だけ。むずかしい操作はありません。</p></div><label class="primary-button file-pick">PDFを開く<input id="file" type="file" accept="application/pdf" hidden></label></div><div class="editor-layout"><aside class="toolbar"><button class="tool active" data-tool="select">↖ <span>選択</span></button><button class="tool" data-tool="text">T <span>テキスト</span></button><button class="tool" data-tool="highlight">▰ <span>ハイライト</span></button><button class="tool" data-tool="underline">＿ <span>下線</span></button><button class="tool" data-tool="redact">■ <span>墨消し</span></button><button class="tool" data-tool="draw">✎ <span>手書き</span></button><button class="tool" data-tool="rect">□ <span>四角</span></button><button class="tool" data-tool="circle">○ <span>丸</span></button><button class="tool" data-tool="stamp">★ <span>スタンプ</span></button><button class="tool" data-tool="signature">署 <span>署名</span></button><div class="tool-options"><label>色<input id="color" type="color" value="#315efb"></label><label>太さ<input id="size" type="range" min="1" max="12" value="3"></label></div><button id="clear" class="secondary-button">このページの編集を消す</button><button id="save" class="primary-button" disabled>編集済みPDFを保存</button></aside><section class="workspace"><div id="empty" class="empty"><div>📄</div><strong>PDFを開いてください</strong><span>開いたPDFの上に、そのまま書きこめます。</span></div><div id="pages" class="pages" hidden></div></section></div></main><script type="module" src="js/pdf-editor.js"></script></body></html>
